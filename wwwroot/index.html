<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>.NET Bootcamp — Beginner to Expert</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="logo" onclick="location.hash='#/'" title="Dashboard">
        <span class="logo-badge">.NET</span>
        <div class="logo-text">
          <strong>Bootcamp</strong>
          <small>.NET 10 · C# 14</small>
        </div>
      </div>
      <button id="theme-toggle" title="Toggle theme">🌓</button>
    </div>
    <div class="sidebar-search">
      <input id="search" type="search" placeholder="Search lessons…" autocomplete="off">
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">
      <div id="global-progress">
        <div class="gp-bar"><div class="gp-fill" id="gp-fill"></div></div>
        <span id="gp-label">0%</span>
      </div>
      <div class="sidebar-actions">
        <button id="export-btn" title="Download your progress as JSON">Export</button>
        <label class="import-label" title="Restore progress from JSON">Import<input type="file" id="import-input" accept=".json" hidden></label>
        <button id="reset-btn" title="Reset all progress">Reset</button>
      </div>
    </div>
  </aside>
  <button id="sidebar-toggle" title="Toggle menu">☰</button>
  <main id="main"></main>
</div>

<script src="js/app.js"></script>
</body>
</html>
